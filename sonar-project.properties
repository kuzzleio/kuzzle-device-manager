sonar.organization=kuzzleio
sonar.projectKey=kuzzleio_kuzzle-device-manager

# relative paths to source directories. More details and properties are described
# at https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope/
sonar.sources=./plugin/lib, ./plugin/index.ts
sonar.tests=./plugin/tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.qualitygate.wait=true

# Coverage exclusions — no coverage report is uploaded to SonarQube Cloud.
# Tests are mostly functional (Kuzzle scenarios run against docker compose).
sonar.coverage.exclusions=**/*.ts
